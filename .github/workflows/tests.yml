name: Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.2

    steps:
    - uses: actions/checkout@v7

    - name: Install make
      run: apt-get update -qq && apt-get install -y -qq make

    - name: Run tests
      run: make test

  apple:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install lint tools
      run: |
        brew install swiftlint swift-format
        python3 -m venv .build/lint-env
        .build/lint-env/bin/pip install --quiet --upgrade git+https://github.com/botforge-pro/commentcensor.git
        echo "$GITHUB_WORKSPACE/.build/lint-env/bin" >> "$GITHUB_PATH"

    - name: Check style
      run: make lint

    - name: Build with SwiftUI
      run: make test-build
