- name: straight space
  words: ["a b", "cat", "sun"]
  turns: 0
  bounded: true
  fallback: false
- name: straight hyphen
  words: ["a-b", "cat", "sun"]
  turns: 0
  bounded: true
  fallback: false
- name: straight apostrophe
  words: ["a'b", "cat", "sun"]
  turns: 0
  bounded: true
  fallback: false
- name: multiple separators
  words: ["a-b's", "c d", "sun"]
  turns: 0
  bounded: true
  fallback: false
- name: shared separators in targets
  words: ["a-b", "c-d", "sun"]
  turns: 0
  bounded: true
  fallback: false
- name: straight bounded fallback
  words: ["a b", "c-d", "e'f"]
  turns: 0
  bounded: true
  fallback: true
- name: straight unbounded fallback
  words: ["a b", "c-d", "e'f"]
  turns: 0
  bounded: false
  fallback: true
- name: turned ordinary fill
  words: ["a b", "c-d", "e'f"]
  turns: 1
  bounded: true
  fallback: false
- name: turned fallback
  words: ["a b", "c-d", "e'f"]
  turns: 1
  bounded: true
  fallback: true
- name: plain straight words
  words: ["cat", "dog", "sun"]
  turns: 0
  bounded: true
  fallback: false
- name: plain turned fallback
  words: ["cat", "dog", "sun"]
  turns: 1
  bounded: true
  fallback: true
- name: bounded field has no room for the required decoy
  words: ["a-b"]
  turns: 0
  bounded: true
  fallback: false
  columns: 3
  rows: 1
  rejects: true
- name: rare accented letter
  words: ["égo", "cat", "sun"]
  turns: 0
  bounded: true
  fallback: false
  conditional: ["é"]
  weights: {x: 1, q: 1, é: 100000}
- name: absent rare letter never enters ordinary fill
  words: ["dog", "cat", "sun"]
  turns: 0
  bounded: true
  fallback: false
  conditional: ["é"]
  weights: {x: 1, q: 1, é: 100000}
- name: turned rare letter fallback
  words: ["égo", "cat", "sun"]
  turns: 1
  bounded: true
  fallback: true
  conditional: ["é"]
  weights: {x: 1, q: 1, é: 100000}
- name: legacy 0.12 separators retain their old fill
  words: ["a-b", "cat", "sun"]
  turns: 0
  bounded: true
  fallback: true
  version: "0.12"
  decoys: false
- name: legacy 0.13 separators retain their old fill
  words: ["a-b", "cat", "sun"]
  turns: 1
  bounded: true
  fallback: true
  version: "0.13"
  decoys: false
- name: a seed without a spare cell uses the checked conditional fallback
  words: ["a-b", "cde", "-e"]
  turns: 0
  bounded: true
  fallback: false
  columns: 4
  rows: 2
  layouts: 40
  probeFallback: true
