cases:
- name: two short words lie in the two rows of a square
  columns: 2
  rows: 2
  rules: [{directions: [right, down], turns: 0}]
  downWords: [0, 2]
  words: [AB, CD]
  outcome: placed
  goldens:
    '0': AB=0,1;1,1|CD=0,0;1,0
    '7': AB=1,0;1,1|CD=0,0;0,1
    '37': AB=0,1;1,1|CD=0,0;1,0
- name: a search allowed no step settles nothing even where a layout exists
