  rows: 2
  rules: [{directions: [right, down], turns: 0}]
  downWords: [0, 2]
  words: [AB, CD]
  nodeLimit: 0
  outcome: undetermined
  goldens: {'0': undetermined, '7': undetermined, '37': undetermined}
- name: a word longer than any straight line has no path
